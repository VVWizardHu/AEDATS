<!doctype html><html lang="zh"><head><meta charset="utf-8">
<title>配色方案对比 · DA 技术服务日常看板</title>
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:#F6F8FA;color:#0F172A;
 font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
 display:flex;align-items:center;justify-content:center;padding:48px 24px;box-sizing:border-box}
.wrap{max-width:760px;width:100%}
h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
p.lead{color:#5A6675;margin:0 0 26px}
a.opt{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #C3CEDA;
 border-radius:8px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
a.opt:hover{border-color:#4F46E5;box-shadow:0 2px 10px rgba(79,70,229,.14)}
.sw{display:inline-flex;gap:0;vertical-align:-2px;margin-right:10px;border-radius:4px;overflow:hidden;border:1px solid #C3CEDA}
.sw i{width:16px;height:16px;display:block}
.t{font-weight:600}
.d{color:#5A6675;font-size:13px;margin-top:3px}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;margin-left:8px;vertical-align:1px}
.ok{background:#ECFDF5;color:#047857}.no{background:#FEF2F2;color:#C81E1E}.mid{background:#FFFBEB;color:#B45309}
</style></head><body><div class="wrap">
<h1>背景配色 · 三方案对比</h1>
<p class="lead">同一份真实数据、同一套布局，只换背景与底色。点开逐个看，直接比。</p>

<a class="opt" href="a-cool.html">
  <div><span class="sw"><i style="background:#F6F8FA"></i><i style="background:#FFFFFF"></i><i style="background:#4F46E5"></i></span>
  <span class="t">A · 冷调中性底（当前线上）</span><span class="tag ok">推荐</span></div>
  <div class="d">冷白画布 + 靛蓝强调。数据色（蓝/紫/青/石板）与底色同一色系，白卡干净，琥珀色警告信号清晰。</div>
</a>

<a class="opt" href="b-warm.html">
  <div><span class="sw"><i style="background:#FDFAF3"></i><i style="background:#FFFFFF"></i><i style="background:#4F46E5"></i></span>
  <span class="t">B · 暖白微黄底</span><span class="tag mid">可接受</span></div>
  <div class="d">极淡暖黄（几乎看不出"黄"，只加温度）+ 保留冷调数据色。想要暖感又不伤数据可读性，选这个。</div>
</a>

<a class="opt" href="c-yellow.html">
  <div><span class="sw"><i style="background:#FFF9D6"></i><i style="background:#FFEFA8"></i><i style="background:#FFFFFF"></i></span>
  <span class="t">C · 明显黄色渐变底</span><span class="tag no">不推荐</span></div>
  <div class="d">看具体问题：黄色泛光让白卡显脏、卡片"浮不起来"；浅黄把琥珀色警告（1–3 月、接起率偏低）的信号吃掉；整页偏暖会削弱蓝色数据的对比感。</div>
</a>

<p style="color:#5A6675;font-size:13px;margin-top:22px">看完告诉我选哪个（A / B / C 或你的具体想法），我改到正式看板上。</p>
</div></body></html>
