name: Genesys queue snapshot
on:
  schedule:
    - cron: '0 17 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: genesys-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r genesys/requirements.txt
      - name: Fetch public queue snapshot
        id: fetch
        env:
          GENESYS_CLIENT_ID: ${{ secrets.GENESYS_CLIENT_ID }}
          GENESYS_CLIENT_SECRET: ${{ secrets.GENESYS_CLIENT_SECRET }}
          PUBLISH_PERSONAL_WORKLOAD: ${{ vars.PUBLISH_PERSONAL_WORKLOAD }}
        run: |
          if [ -z "$GENESYS_CLIENT_ID" ] || [ -z "$GENESYS_CLIENT_SECRET" ]; then
            echo "Credentials not configured: scheduled collection skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m genesys.daily_collect
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Commit snapshot
        if: steps.fetch.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/genesys.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh Genesys queue snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
