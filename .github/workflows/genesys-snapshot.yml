name: Genesys queue snapshot
on:
  schedule:
    - cron: '3/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: genesys-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r genesys/requirements.txt
      - name: Fetch public queue snapshot
        env:
          GENESYS_CLIENT_ID: ${{ secrets.GENESYS_CLIENT_ID }}
          GENESYS_CLIENT_SECRET: ${{ secrets.GENESYS_CLIENT_SECRET }}
          PUBLISH_PERSONAL_WORKLOAD: ${{ vars.PUBLISH_PERSONAL_WORKLOAD }}
        run: python -m genesys.collect
      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/genesys.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh Genesys queue snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
