<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DA 技术服务日常看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* 配色：柔和低饱和（祥和感）+ 对比度按 WCAG 校验（2026-09，见 ui-ux-design skill）
       ink-soft ≥4.5:1；填充色对卡片白 ≥3:1；-ink 变体专供「文字」（对浅底 ≥4.5:1） */
    --paper:#F4F6F4; --panel:#FAFBFA; --card:#FFFFFF; --ink:#333F3D; --ink-soft:#687270;
    --hair:#D8DEDA; --teal:#6A9C94; --teal-soft:#E4EEEC; --amber:#B08B58; --amber-soft:#F7EDDD;
    --rust:#C38672; --rust-soft:#F5E5DF; --moss:#958EAD; --blue:#7F94A3;
    --teal-ink:#4B716B; --amber-ink:#846741; --rust-ink:#885E50; --moss-ink:#6B6489;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'IBM Plex Sans',-apple-system,'PingFang SC',sans-serif;-webkit-font-smoothing:antialiased;}
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
  .wrap{max-width:1720px;margin:0 auto;padding:18px 24px 26px;}

  header{display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid var(--ink);padding-bottom:13px;margin-bottom:16px;}
  header h1{font-family:'IBM Plex Sans Condensed';font-weight:700;font-size:28px;margin:0;letter-spacing:.2px;}
  header .period{font-size:13.5px;color:var(--ink-soft);margin-top:6px;}
  .hright{display:flex;align-items:center;gap:16px;}
  header .pulled{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
  header .pulled .num{font-size:13px;color:var(--ink);margin-left:6px;letter-spacing:0;text-transform:none;}
  /* 语言切换 */
  .lang{display:inline-flex;border:1px solid var(--hair);background:var(--panel);border-radius:3px;overflow:hidden;}
  .lang button{font:inherit;font-size:11.5px;line-height:1;padding:6px 12px;border:0;background:transparent;
    color:var(--ink-soft);cursor:pointer;letter-spacing:.3px;}
  .lang button + button{border-left:1px solid var(--hair);}
  .lang button:hover{background:var(--teal-soft);color:var(--teal-ink);}
  .lang button.on{background:var(--teal);color:#fff;font-weight:600;}

  /* ---- KPI 卡 ---- */
  .kpi-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:22px;}
  @media (max-width:1080px){.kpi-strip{grid-template-columns:repeat(3,minmax(0,1fr));}}
  @media (max-width:620px){.kpi-strip{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .kpi{background:var(--card);border:1px solid var(--hair);border-top:3px solid var(--teal);
    padding:12px 13px 13px;position:relative;}
  .kpi.warn{border-top-color:var(--amber);}
  .kpi.risk{border-top-color:var(--rust);}
  .kpi.muted{border-top-color:var(--ink-soft);}
  .kpi .k-label{font-size:10.5px;color:var(--ink-soft);letter-spacing:.3px;text-transform:uppercase;line-height:1.35;}
  .kpi .k-val{font-size:26px;font-weight:600;line-height:1.15;margin-top:5px;}
  .kpi .k-sub{font-size:10.5px;color:var(--ink-soft);margin-top:4px;line-height:1.4;}
  /* 重点指标高亮 */
  .kpi.emph{border-top-width:4px;border-top-color:var(--rust);
    background:linear-gradient(180deg,var(--rust-soft) 0%,var(--card) 62%);}
  .kpi.emph2{border-top-width:4px;border-top-color:var(--amber);
    background:linear-gradient(180deg,var(--amber-soft) 0%,var(--card) 62%);}
  .kpi .badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:9px;
    background:var(--rust);color:#fff;margin-left:7px;vertical-align:3px;letter-spacing:.3px;}
  .kpi .badge.sand{background:var(--amber);}
  tr.hot td{background:var(--amber-soft);font-weight:600;}
  tr.hot td:first-child{border-left:3px solid var(--amber);padding-left:9px;}

  /* ---- 宽屏仪表盘：左右双栏，一屏装下 ---- */
  .dash{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:14px;align-items:start;}
  .col-main,.col-side{display:flex;flex-direction:column;gap:14px;min-width:0;}
  .dash .card{margin-bottom:0;}
  .dash .two-col{gap:14px;margin:0;}
  @media (max-width:1180px){
    .dash{grid-template-columns:1fr;}
    .col-side{order:-1;}          /* 窄屏时 Trengo / Hotline 仍在 Ticket 明细之前 */
  }
  /* 显示器高度不够时整体收紧，尽量一屏 */
  @media (max-height:960px){
    .wrap{padding:12px 18px 16px;}
    header{padding-bottom:9px;margin-bottom:11px;}
    header h1{font-size:23px;}
    header .period{font-size:12.5px;margin-top:4px;}
    .kpi-strip{margin-bottom:12px;gap:9px;}
    .kpi{padding:10px 12px 11px;}
    .kpi .k-val{font-size:24px;}
    .kpi .k-label,.kpi .k-sub{font-size:10px;}
    .card{padding:12px 14px 13px;}
    .card h2{font-size:15px;}
    .card .sub{font-size:11px;margin-bottom:8px;}
    .stack{height:19px;margin-bottom:8px;}
    .tier-cell,.age-cell,.tre-cell{padding:9px 11px;}
    .tier-cell .t-val,.age-cell .a-val,.tre-cell .tre-val{font-size:21px;margin-top:2px;}
    .age-cell.hot .a-val{font-size:24px;}
    .tier-cell .t-na,.tier-cell .t-share,.age-cell .a-share,.age-cell .a-new,.tre-cell .tre-sub{font-size:10.5px;margin-top:2px;}
    .age-cell .a-new{padding-top:6px;margin-top:7px;}
    td{padding:5px 0;}
    th{padding-bottom:5px;}
    .q-row{margin-bottom:5px;}
    .q-bar{height:16px;}
    .q-stats .rate b{font-size:14px;}
    .tre-cell .tre-val{font-size:24px;}
    footer{padding-top:8px;margin-top:10px;font-size:11px;}
  }

  .card{background:var(--card);border:1px solid var(--hair);padding:16px 18px 17px;margin-bottom:14px;
    box-shadow:0 1px 2px rgba(51,63,61,.05);}
  .card h2{font-family:'IBM Plex Sans Condensed';font-weight:700;font-size:16.5px;margin:0 0 2px;}
  .card .sub{font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;}

  /* ---- 分层 / 账龄：紧凑堆叠条 + 两行单元格 ---- */
  .blk + .blk{margin-top:12px;padding-top:11px;border-top:1px dashed var(--hair);}
  .blk-name{font-size:11px;font-weight:600;color:var(--ink-soft);letter-spacing:.4px;margin-bottom:5px;}
  .stack{display:flex;height:21px;border:1px solid var(--hair);overflow:hidden;margin-bottom:9px;}
  /* 段内文字用深色（对中等明度填充 ≥5:1）；每段纹样角度不同，不靠颜色也能区分（色盲友好） */
  .stack .seg{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;
    color:#131A18;min-width:2px;white-space:nowrap;overflow:hidden;}
  .stack .seg.s1{background-color:var(--teal);
    background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.30) 0 3px,transparent 3px 9px);}
  .stack .seg.s2{background-color:var(--amber);
    background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.30) 0 3px,transparent 3px 9px);}
  .stack .seg.s3{background-color:var(--rust);
    background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.30) 0 3px,transparent 3px 9px);}
  .stack .seg.s4{background-color:var(--moss);
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.30) 0 3px,transparent 3px 9px);}
  .stack .seg.g1{background-color:var(--rust);
    background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.30) 0 3px,transparent 3px 9px);}
  .stack .seg.g2{background-color:var(--amber);
    background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.30) 0 3px,transparent 3px 9px);}
  .stack .seg.g3{background-color:var(--blue);
    background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.30) 0 3px,transparent 3px 9px);}
  .tier-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .age-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .tier-cell,.age-cell{border:1px solid var(--hair);border-left:4px solid var(--teal);
    padding:8px 11px;background:var(--panel);}
  .tier-cell.c2{border-left-color:var(--amber);}
  .tier-cell.c3{border-left-color:var(--rust);}
  .tier-cell.c4{border-left-color:var(--moss);}
  .age-cell{border-left:1px solid var(--hair);border-top:4px solid var(--rust);}
  .age-cell.a2{border-top-color:var(--amber);}
  .age-cell.a3{border-top-color:var(--blue);}
  .age-cell.hot{border:1px solid var(--rust);border-top:5px solid var(--rust);
    background:linear-gradient(180deg,var(--rust-soft) 0%,var(--panel) 62%);}
  .tier-cell .t-name,.age-cell .a-name{display:flex;align-items:baseline;gap:7px;
    font-size:11px;font-weight:600;color:var(--ink-soft);letter-spacing:.3px;line-height:1.3;}
  .tier-cell .t-val,.age-cell .a-val{font-size:22px;font-weight:600;color:var(--ink);}
  .age-cell.hot .a-val{font-size:25px;}
  .tier-cell .t-meta,.age-cell .a-meta{font-size:10.5px;color:var(--ink-soft);margin-top:3px;line-height:1.45;}
  .tier-cell .t-meta.warn,.age-cell .a-meta.warn{color:var(--amber-ink);}
  .tier-cell .t-meta.risk,.age-cell .a-meta.risk{color:var(--rust-ink);}
  .age-cell .a-flag{display:inline-block;font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:8px;
    background:var(--rust);color:#fff;vertical-align:1px;}
  @media (max-width:820px){.tier-grid{grid-template-columns:repeat(2,1fr);}.age-grid{grid-template-columns:1fr;}}

  /* ---- 表格 ---- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:right;font-weight:600;font-size:10.5px;color:var(--ink-soft);letter-spacing:.4px;
    text-transform:uppercase;border-bottom:1px solid var(--ink);padding:0 0 7px;}
  th:first-child{text-align:left;}
  td{text-align:right;padding:7px 0;border-bottom:1px solid var(--hair);}
  td:first-child{text-align:left;font-weight:500;}
  tr.total td{border-top:1px solid var(--ink);border-bottom:none;font-weight:600;}
  .up{color:var(--rust-ink);} .down{color:var(--moss-ink);} .flat{color:var(--ink-soft);}
  .pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--teal-soft);color:var(--teal-ink);}
  .note{font-size:10.5px;color:var(--ink-soft);border-top:1px dashed var(--hair);padding-top:8px;margin-top:9px;line-height:1.5;}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch;}
  .two-col .card{margin-bottom:14px;display:flex;flex-direction:column;}
  .two-col .card .note{margin-top:auto;}
  @media (max-width:820px){.two-col{grid-template-columns:1fr;}}

  /* ---- Trengo / DA WA ---- */
  .tre-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .tre-cell{border:1px solid var(--hair);background:var(--panel);padding:14px 16px;border-top:4px solid var(--amber);}
  .tre-cell.k-work{border-top-color:var(--blue);}
  .tre-cell.k-done{border-top-color:var(--teal);}
  .tre-cell .tre-name{font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.3px;}
  .tre-cell .tre-val{font-size:30px;font-weight:600;line-height:1.15;margin-top:6px;}
  .tre-cell .tre-sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .tre-cell .tre-sub b{font-family:'IBM Plex Mono',monospace;color:var(--ink);}
  @media (max-width:820px){.tre-grid{grid-template-columns:1fr;}}

  /* ---- Hotline ---- */
  .q-row{display:grid;grid-template-columns:132px 1fr 244px;align-items:center;gap:12px;margin-bottom:7px;}
  .q-row .q-name{font-size:12px;font-weight:600;}
  .q-bar{display:flex;height:19px;border:1px solid var(--hair);overflow:hidden;}
  .q-bar .seg{min-width:1px;}
  .q-bar .answered{background:var(--teal);}
  .q-bar .abandoned{background:repeating-linear-gradient(135deg,var(--amber),var(--amber) 4px,var(--amber-soft) 4px,var(--amber-soft) 8px);}
  .q-bar .rest{background:#E6E9E7;}
  .q-stats{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:baseline;gap:10px;justify-content:flex-end;}
  .q-stats b{color:var(--ink);font-family:'IBM Plex Mono',monospace;}
  /* 接起率重点显示 */
  .q-stats .rate{font-size:12.5px;font-weight:700;color:var(--ink);}
  .q-stats .rate b{font-size:16px;font-weight:700;color:var(--teal-ink);letter-spacing:-.4px;}
  .q-stats .rate.low b{color:var(--rust-ink);}
  .q-stats .rate.mid b{color:var(--amber-ink);}
  .legend{display:flex;gap:18px;font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;}
  .legend i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px;border:1px solid var(--hair);}
  .legend .l-ans{background:var(--teal);}
  .legend .l-ab{background:repeating-linear-gradient(135deg,var(--amber),var(--amber) 3px,var(--amber-soft) 3px,var(--amber-soft) 6px);}
  .legend .l-rest{background:#E6E9E7;}

  footer{border-top:1px solid var(--hair);padding-top:12px;margin-top:18px;font-size:11.5px;color:var(--ink-soft);line-height:1.65;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 id="pageH1"></h1>
      <div class="period" id="periodLine"></div>
    </div>
    <div class="hright">
      <div class="lang" id="langSwitch">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="de">Deutsch</button>
      </div>
      <div class="pulled"><span id="pulledLabel"></span><span class="num" id="pulledTime"></span></div>
    </div>
  </header>

  <div class="kpi-strip" id="kpiRow"></div>

  <div class="dash">
    <div class="col-main">
        <div class="card">
          <h2 id="tierTitle"></h2>
          <div class="sub" id="tierSub"></div>
          <div class="blk">
            <div class="blk-name" id="tierBlkName"></div>
            <div class="stack" id="tierStack" role="img"></div>
            <div class="tier-grid" id="tierGrid"></div>
          </div>
          <div class="blk">
            <div class="blk-name" id="ageBlkName"></div>
            <div class="stack" id="ageStackAll" role="img"></div>
            <div class="age-grid" id="ageGrid"></div>
          </div>
        </div>
        <div class="two-col">
          <div class="card">
            <h2 id="deltaTitle"></h2>
            <div class="sub" id="deltaSub"></div>
            <div class="tbl-fill"><table id="deltaTable"></table></div>
            <div class="note" id="deltaNote"></div>
          </div>
          <div class="card">
            <h2 id="woTitle"></h2>
            <div class="sub" id="woSub"></div>
            <div class="tbl-fill"><table id="woTable"></table></div>
            <div class="note" id="woNote"></div>
          </div>
        </div>
    </div>
    <div class="col-side">
        <div class="card">
          <h2 id="trengoTitle"></h2>
          <div class="sub" id="trengoSub"></div>
          <div class="tre-grid" id="treGrid"></div>
        </div>
        <div class="card">
          <h2 id="hotlineTitle"></h2>
          <div class="sub" id="hotlineSub"></div>
          <div class="legend" id="hotlineLegend"></div>
          <div id="hotlineBars"></div>
        </div>
    </div>
  </div>

  <footer id="footNote"></footer>

</div>

<script>

const PULLED = new Date(1789568396339);

const noAction = {"德语区(DE/AT)|L1":432,"德语区(DE/AT)|L2":5,"德语区(DE/AT)|L3":25,"德语区(DE/AT)|L4":1};

const TRENGO_PULLED = new Date(1789568420897);

/* ========== 双语词典 ========== */
const I18N = {

    thMetric:'指标', thThis:'本周', thLast:'上周', thDelta:'环比',
    rowNew:'新增 Ticket', rowClosed:'关闭 Ticket', rowNet:'净变化',

    woNote:'已转上门工单 <b>{n}</b> 条单独统计，不计入 Ticket 存量',
    hotlineTitle:'Hotline 情况',
    hotlineSub:'数据来源 Genesys Cloud（voice queue）　·　条形＝各队列来电构成（按占比填满整行）',
    treTitle:'Trengo · DA WA（WhatsApp 客服）',
    treSub:'渠道「DA WA (+49 1522 3112326)」　·　数据来源 Trengo　·　拉取时间 {t}',
    treWait:'新单待分派', treWaitSub:'未关闭且尚未分配处理人',
    treWorking:'处理中', treWorkingSub:'已分配给客服，尚未关闭',
    treDone:'本周已处理', treDoneSub:'上周 <b>{p}</b> · 环比 {d}',
    legAns:'接起', legAb:'放弃', legRest:'其他未接', legOther:'其他未接',
    qCalls:'来电', qRate:'接起率', qAbandon:'放弃率', qTotal:'合计',
    foot:'Ticket 判断字段 alp_casegrade / alp_casestatus　·　Work Order 判断字段 alp_chooseprocessingmethod / alp_onsitemethod / msdyn_systemstatus<br>地区范围仅覆盖德语区(DE/AT)；存量＝Created + In Progress(Service)（不含已转上门工单）',
    woTypeInternal:'内部上门', woTypeProvider:'服务商上门', woTypeShipping:'发货',
  },
  de: {
    pageTitle:'DA Technischer Service – Tagesübersicht',
    period:'Zeitraum {p}　·　Datenquelle: D365 CRM',
    pulled:'Abgerufen',
    kStock:'Ticket-Bestand', kStockSub:'Offene, unbearbeitete Fälle',
    kOld:'Offen über 3 Monate', kOldSub:'{s} des Bestands · vorrangig bearbeiten', bOld:'Rückstand',
    kNa:'Ohne Aktivität', kNaSub:'{n} Fälle · 5 Werktage ohne Update',
    kNew:'Neu diese Woche', kNewSub:'Vorwoche {p} · Δ {d}',
    kClosed:'Geschlossen diese Woche', kClosedSub:'Vorwoche {p} · Δ {d}',
    kWO:'WO Innen-Onsite', kWOSub:'Offene Onsite-Aufträge des eigenen Teams', bOwn:'Eigenes Team',
    tierTitle:'Ticket-Struktur · Ebene & Alter',
    tierBlk:'nach Ebene (L1–L4)', ageBlk:'nach Alter (offen)',
    tierSub:'Gesamt {tot} · davon ohne Aktivität {na} ({pct} %)　|　Balken = Zusammensetzung nach Ebene',
    tierShare:'Anteil am DA-Bestand {s}', tierNa:'ohne Aktivität',
    ageTitle:'Fallalter · offen / neu & unbearbeitet',
    ageSub:'Offen gesamt {tot} (nach Erstellungsdatum); davon „neu & unbearbeitet" (Status = Created) {nw}',
    ageL1:'über 3 Monate', ageL2:'1 – 3 Monate', ageL3:'bis 1 Monat',
    ageFlag:'priorisieren', ageShare:'{s} der offenen', ageNew:'neu & unbearbeitet', ageOf:'{s} der Gruppe',
    deltaTitle:'Neu / Geschlossen diese Woche', deltaSub:'Δ = Vergleich mit der ganzen Vorwoche (rot = schlechter, grün = besser)',
    deltaNote:'Schließdatum: alp_closedstatusupdatedon; Woche ab Montag 00:00',
    thMetric:'Kennzahl', thThis:'Diese Woche', thLast:'Vorwoche', thDelta:'Δ',
    rowNew:'Neue Tickets', rowClosed:'Geschlossene Tickets', rowNet:'Nettoveränderung',
    woTitle:'Work-Order-Bestand · nach Typ', woSub:'Offene Aufträge, ohne versandte (Shipped)',
    woOwn:'eigenes Team', woTotal:'Gesamt',
    woNote:'<b>{n}</b> an Onsite-Tickets übergeben (separat gezählt, nicht im Ticket-Bestand)',
    hotlineTitle:'Hotline-Übersicht',
    hotlineSub:'Quelle: Genesys Cloud (Voice Queue)　|　Balken = Zusammensetzung der Anrufe je Queue',
    treTitle:'Trengo · DA WA (WhatsApp-Support)',
    treSub:'Kanal „DA WA (+49 1522 3112326)"　·　Quelle: Trengo　·　Abgerufen {t}',
    treWait:'Neu, nicht zugewiesen', treWaitSub:'offen und noch keinem Bearbeiter zugewiesen',
    treWorking:'In Bearbeitung', treWorkingSub:'einem Agenten zugewiesen, noch nicht geschlossen',
    treDone:'Diese Woche erledigt', treDoneSub:'Vorwoche <b>{p}</b> · Δ {d}',
    legAns:'angenommen', legAb:'abgebrochen', legRest:'sonst. verpasst', legOther:'sonst. verpasst',
    qCalls:'Anrufe', qRate:'Annahmequote', qAbandon:'Abbruchquote', qTotal:'Gesamt',
    foot:'Ticket-Kriterien: alp_casegrade / alp_casestatus　·　Work-Order-Kriterien: alp_chooseprocessingmethod / alp_onsitemethod / msdyn_systemstatus<br>Region: nur deutschsprachiger Raum (DE/AT); Bestand = Created + In Progress(Service) (ohne an Onsite-Tickets übergebene Fälle)',
    woTypeInternal:'Innen-Onsite', woTypeProvider:'Dienstleister-Onsite', woTypeShipping:'Versand',
  }
};
const WO_TYPE_KEY = {'内部上门':'woTypeInternal','服务商上门':'woTypeProvider','发货':'woTypeShipping'};

let LANG = localStorage.getItem('dashLang') || 'zh';
function t(k, vars){
  let s = (I18N[LANG] && I18N[LANG][k]) || I18N.zh[k] || k;
  if (vars) Object.keys(vars).forEach(v => { s = s.split('{' + v + '}').join(vars[v]); });
  return s;
}
function fmt(n){ return Number(n).toLocaleString(LANG === 'de' ? 'de-DE' : 'zh-CN'); }
function pc(v, d){ const s = Number(v).toFixed(d === undefined ? 1 : d); return LANG === 'de' ? s + ' %' : s + '%'; }

const REG = regions[0];
function sum(map, keys){ return keys.reduce((s,k)=> s + (map[REG+'|'+k]||0), 0); }

const ageKeys = ['>3m', '1-3m', '<1m'];
const AGE_KEY = {'>3m':'ageL1', '1-3m':'ageL2', '<1m':'ageL3'};

// ---- Hotline 静态数据（Genesys Cloud，脚本不更新）----
const hotlineQueues = {
  "德语区(DE/AT)": [
    {name:"GER-On-Site", offer:6, answer:4, abandon:2},
    {name:"GER_Installer", offer:4, answer:4, abandon:0},
    {name:"GER_End_User", offer:133, answer:10, abandon:58},
  ],
};

function delta(cur, prev, goodWhenDown){
  const d = cur - prev;
  const cls = d === 0 ? 'flat' : ((d > 0) !== !!goodWhenDown ? 'up' : 'down');
  return `<span class="${cls}">${d>0?'+':''}${fmt(d)}</span>`;
}

/* ========== 渲染 ========== */
function render(){
  document.documentElement.lang = LANG === 'de' ? 'de' : 'zh-CN';
  document.title = t('pageTitle');
  document.getElementById('pageH1').textContent = t('pageTitle');
  const ps = weekStart.toLocaleDateString('sv-SE');
  const pe = new Date(weekStart.getTime() + 6 * 86400000);
  const pStr = ps + ' ~ ' + pe.toLocaleDateString('sv-SE').slice(5);
  document.getElementById('periodLine').textContent = t('period', {p: pStr});
  document.getElementById('pulledLabel').textContent = t('pulled');
  document.getElementById('pulledTime').textContent =
    PULLED.toLocaleString(LANG === 'de' ? 'de-DE' : 'zh-CN',
      {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});

  // ---- KPI ----
  const ticketTot = sum(stock, tiers), naTot = sum(noAction, tiers);
  const woTot = sum(woStock, types), onsiteTot = sum(onsite, tiers);
  const naPct = ticketTot ? Math.round(naTot / ticketTot * 100) : 0;
  const nt = sum(newThis, tiers), nl = sum(newLast, tiers);
  const ct = sum(closedThis, tiers), cl = sum(closedLast, tiers);
  const naCls = naPct >= 45 ? 'risk' : (naPct >= 25 ? 'warn' : '');
  const oldTot = ageAll[REG+'|>3m'] || 0;
  const oldShare = ticketTot ? (oldTot / ticketTot * 100) : 0;
  const internalWO = woStock[REG+'|内部上门'] || 0;
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi">
      <div class="k-label">${t('kStock')}</div>
      <div class="k-val num">${fmt(ticketTot)}</div>
      <div class="k-sub">${t('kStockSub')}</div>
    </div>
    <div class="kpi emph">
      <div class="k-label">${t('kOld')}<span class="badge">${t('bOld')}</span></div>
      <div class="k-val num">${fmt(oldTot)}</div>
      <div class="k-sub">${t('kOldSub', {s: pc(oldShare)})}</div>
    </div>
    <div class="kpi ${naCls}">
      <div class="k-label">${t('kNa')}</div>
      <div class="k-val num">${naPct}${LANG==='de'?' %':'%'}</div>
      <div class="k-sub">${t('kNaSub', {n: fmt(naTot)})}</div>
    </div>
    <div class="kpi">
      <div class="k-label">${t('kNew')}</div>
      <div class="k-val num">${fmt(nt)}</div>
      <div class="k-sub">${t('kNewSub', {p: fmt(nl), d: (nt-nl>0?'+':'') + fmt(nt-nl)})}</div>
    </div>
    <div class="kpi">
      <div class="k-label">${t('kClosed')}</div>
      <div class="k-val num">${fmt(ct)}</div>
      <div class="k-sub">${t('kClosedSub', {p: fmt(cl), d: (ct-cl>0?'+':'') + fmt(ct-cl)})}</div>
    </div>
    <div class="kpi emph2">
      <div class="k-label">${t('kWO')}<span class="badge sand">${t('bOwn')}</span></div>
      <div class="k-val num">${fmt(internalWO)}</div>
      <div class="k-sub">${t('kWOSub')}</div>
    </div>`;

  // ---- Ticket 分层 ----
  let segs = '', cells = '';
  tiers.forEach((tr, i)=>{
    const s = stock[REG+'|'+tr] || 0;
    const na = noAction[REG+'|'+tr] || 0;
    const share = ticketTot ? (s / ticketTot * 100) : 0;
    const naPctT = s ? (na / s * 100) : 0;
    segs += `<div class="seg s${i+1}" style="width:${share}%" title="${tr} ${fmt(s)}">${share >= 5 ? tr : ''}</div>`;
    const c = naPctT >= 45 ? 'risk' : (naPctT >= 25 ? 'warn' : '');
    cells += `
      <div class="tier-cell c${i+1}">
        <div class="t-name">${tr}<span class="t-val num">${fmt(s)}</span></div>
        <div class="t-meta ${c}">${t('tierShare', {s: pc(share)})} · ${t('tierNa')} ${fmt(na)}（${pc(naPctT, 0)}）</div>
      </div>`;
  });
  document.getElementById('tierTitle').textContent = t('tierTitle');
  const tierStackEl = document.getElementById('tierStack');
  tierStackEl.innerHTML = segs;
  tierStackEl.setAttribute('aria-label', tiers.map(tr =>
    `${tr} ${fmt(stock[REG+'|'+tr] || 0)}`).join('，'));
  document.getElementById('tierGrid').innerHTML = cells;
  document.getElementById('tierSub').textContent =
    t('tierSub', {tot: fmt(ticketTot), na: fmt(naTot), pct: naPct});

  // ---- 账龄 ----
  const ageAllTot = ageKeys.reduce((s, k)=> s + (ageAll[REG+'|'+k] || 0), 0);
  const ageNewTot = ageKeys.reduce((s, k)=> s + (ageNew[REG+'|'+k] || 0), 0);
  let aSegs = '', aCells = '';
  ageKeys.forEach((k, i)=>{
    const v = ageAll[REG+'|'+k] || 0;
    const nv = ageNew[REG+'|'+k] || 0;
    const share = ageAllTot ? (v / ageAllTot * 100) : 0;
    const lbl = t(AGE_KEY[k]);
    aSegs += `<div class="seg g${i+1}" style="width:${share}%" title="${lbl} ${fmt(v)}">${share >= 8 ? k : ''}</div>`;
    aCells += `
      <div class="age-cell a${i+1}${k === '>3m' ? ' hot' : ''}">
        <div class="a-name">${lbl}<span class="a-val num">${fmt(v)}</span>${k === '>3m' ? `<span class="a-flag">${t('ageFlag')}</span>` : ''}</div>
        <div class="a-meta">${t('ageShare', {s: pc(share)})} · ${t('ageNew')} ${fmt(nv)}${nv ? `（${t('ageOf', {s: pc(v ? nv/v*100 : 0, 0)})}）` : ''}</div>
      </div>`;
  });
  document.getElementById('tierBlkName').textContent = t('tierBlk');
  document.getElementById('ageBlkName').textContent =
    t('ageBlk') + '　·　' + t('ageSub', {tot: fmt(ageAllTot), nw: fmt(ageNewTot)});
  const ageStackEl = document.getElementById('ageStackAll');
  ageStackEl.innerHTML = aSegs;
  ageStackEl.setAttribute('aria-label', ageKeys.map(k =>
    `${t(AGE_KEY[k])} ${fmt(ageAll[REG+'|'+k] || 0)}`).join('，'));
  document.getElementById('ageGrid').innerHTML = aCells;

  // ---- 本周变化 ----
  document.getElementById('deltaTitle').textContent = t('deltaTitle');
  document.getElementById('deltaSub').textContent = t('deltaSub');
  document.getElementById('deltaNote').textContent = t('deltaNote');
  document.getElementById('deltaTable').innerHTML = `
    <caption class="sr-only">${t('deltaTitle')}</caption>
    <tr><th scope="col">${t('thMetric')}</th><th scope="col">${t('thThis')}</th><th scope="col">${t('thLast')}</th><th scope="col">${t('thDelta')}</th></tr>
    <tr><td>${t('rowNew')}</td><td class="num">${fmt(nt)}</td><td class="num">${fmt(nl)}</td><td class="num">${delta(nt,nl,true)}</td></tr>
    <tr><td>${t('rowClosed')}</td><td class="num">${fmt(ct)}</td><td class="num">${fmt(cl)}</td><td class="num">${delta(ct,cl,false)}</td></tr>
    <tr class="total"><td>${t('rowNet')}</td><td class="num">${(nt-ct>0?'+':'')}${fmt(nt-ct)}</td><td class="num">${(nl-cl>0?'+':'')}${fmt(nl-cl)}</td><td class="num">${delta(nt-ct, nl-cl, true)}</td></tr>`;

  // ---- WO ----
  let wRows = '';
  types.forEach(ty=>{
    const v = woStock[REG+'|'+ty] || 0;
    const hot = ty === '内部上门';
    wRows += `<tr${hot ? ' class="hot"' : ''}><td>${t(WO_TYPE_KEY[ty])}${hot ? ' · ' + t('woOwn') : ''}</td><td class="num">${fmt(v)}</td></tr>`;
  });
  wRows += `<tr class="total"><td>${t('woTotal')}</td><td class="num">${fmt(woTot)}</td></tr>`;
  document.getElementById('woTitle').textContent = t('woTitle');
  document.getElementById('woSub').textContent = t('woSub');
  document.getElementById('woTable').innerHTML = wRows;
  document.getElementById('woNote').innerHTML = t('woNote', {n: fmt(onsiteTot)});

  // ---- Trengo · DA WA ----
  const treDT = TRENGO_PULLED.getTime()
    ? TRENGO_PULLED.toLocaleString(LANG === 'de' ? 'de-DE' : 'zh-CN',
        {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'})
    : '—';
  document.getElementById('trengoTitle').textContent = t('treTitle');
  document.getElementById('trengoSub').textContent = t('treSub', {t: treDT});
  const treDelta = trengoClosedThis - trengoClosedLast;
  document.getElementById('treGrid').innerHTML = `
    <div class="tre-cell">
      <div class="tre-name">${t('treWait')}</div>
      <div class="tre-val num">${fmt(trengoNew)}</div>
      <div class="tre-sub">${t('treWaitSub')}</div>
    </div>
    <div class="tre-cell k-work">
      <div class="tre-name">${t('treWorking')}</div>
      <div class="tre-val num">${fmt(trengoAssigned)}</div>
      <div class="tre-sub">${t('treWorkingSub')}</div>
    </div>
    <div class="tre-cell k-done">
      <div class="tre-name">${t('treDone')}</div>
      <div class="tre-val num">${fmt(trengoClosedThis)}</div>
      <div class="tre-sub">${t('treDoneSub', {p: fmt(trengoClosedLast),
        d: (treDelta > 0 ? '+' : '') + fmt(treDelta)})}</div>
    </div>`;

  // ---- Hotline ----
  document.getElementById('hotlineTitle').textContent = t('hotlineTitle');
  document.getElementById('hotlineSub').textContent = t('hotlineSub');
  document.getElementById('hotlineLegend').innerHTML =
    `<span><i class="l-ans"></i>${t('legAns')}</span>
     <span><i class="l-ab"></i>${t('legAb')}</span>
     <span><i class="l-rest"></i>${t('legRest')}</span>`;
  const hb = document.getElementById('hotlineBars');
  const queues = hotlineQueues[REG];
  if(!queues){
    hb.innerHTML = `<div class="sub">—</div>`;
  } else {
    const tOffer = queues.reduce((s,q)=>s+q.offer,0);
    const tAns = queues.reduce((s,q)=>s+q.answer,0);
    const tAb = queues.reduce((s,q)=>s+q.abandon,0);
    function bar(q){
      const aPct = q.offer ? q.answer / q.offer * 100 : 0;
      const abPct = q.offer ? q.abandon / q.offer * 100 : 0;
      const restPct = Math.max(0, 100 - aPct - abPct);
      return `<div class="q-bar">
          <div class="seg answered" style="width:${aPct}%"></div>
          <div class="seg abandoned" style="width:${abPct}%"></div>
          <div class="seg rest" style="width:${restPct}%"></div>
        </div>`;
    }
    const rate = (p) => p < 50 ? 'low' : (p < 80 ? 'mid' : '');
    let rows = '';
    queues.forEach(q=>{
      const aPct = q.offer ? q.answer / q.offer * 100 : 0;
      const abPct = q.offer ? q.abandon / q.offer * 100 : 0;
      rows += `
        <div class="q-row">
          <div class="q-name">${q.name}</div>
          ${bar(q)}
          <div class="q-stats">
            <span>${t('qCalls')} <b>${fmt(q.offer)}</b></span>
            <span class="rate ${rate(aPct)}">${t('qRate')} <b>${pc(aPct, 1)}</b></span>
            <span>${t('qAbandon')} <b class="${abPct>=30?'up':''}">${pc(abPct, 1)}</b></span>
          </div>
        </div>`;
    });
    const tAPct = tOffer ? tAns/tOffer*100 : 0;
    const tAbPct = tOffer ? tAb/tOffer*100 : 0;
    rows += `
      <div class="q-row" style="margin-top:10px;border-top:1px solid var(--ink);padding-top:9px;">
        <div class="q-name">${t('qTotal')}</div>
        ${bar({offer:tOffer, answer:tAns, abandon:tAb})}
        <div class="q-stats">
          <span>${t('qCalls')} <b>${fmt(tOffer)}</b></span>
          <span class="rate ${rate(tAPct)}">${t('qRate')} <b>${pc(tAPct, 1)}</b></span>
          <span>${t('qAbandon')} <b class="${tAbPct>=30?'up':''}">${pc(tAbPct, 1)}</b></span>
        </div>
      </div>`;
    hb.innerHTML = rows;
  }

  // ---- 页脚 ----
  document.getElementById('footNote').innerHTML = t('foot');

  // ---- 语言按钮状态 ----
  document.querySelectorAll('#langSwitch button').forEach(b=>{
    b.classList.toggle('on', b.dataset.lang === LANG);
  });
}

document.querySelectorAll('#langSwitch button').forEach(b=>{
  b.addEventListener('click', ()=>{
    LANG = b.dataset.lang;
    localStorage.setItem('dashLang', LANG);
    render();
  });
});

render();
</script>
</body>
</html>
